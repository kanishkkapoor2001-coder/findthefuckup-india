services:
  - type: web
    name: findthefuckup-india
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: findthefuckup-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: findthefuckup-db
    plan: free
    databaseName: findthefuckup
    user: findthefuckup
