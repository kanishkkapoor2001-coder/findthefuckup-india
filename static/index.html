<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Flaw · India — Contract error checker for Indian SaaS</title>
    <meta name="description" content="Drop an Indian commercial contract, get the flaws. DPDPA, FEMA, GST, stamp duty, Indian Contract Act and the usual drafting sins. Built by Sigil.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --canvas: #0A0A0A;
            --surface: #111111;
            --elevated: #161616;
            --ink: #FAFAF7;
            --ink-85: rgba(250,250,247,0.85);
            --ink-70: rgba(250,250,247,0.70);
            --ink-55: rgba(250,250,247,0.55);
            --ink-40: rgba(250,250,247,0.40);
            --ink-25: rgba(250,250,247,0.25);
            --ink-12: rgba(250,250,247,0.12);
            --ink-08: rgba(250,250,247,0.08);
            --high: #f87171;
            --medium: #fbbf24;
            --low: #86efac;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--canvas);
            color: var(--ink);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            min-height: 100vh;
        }

        .display { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; }

        ::selection { background: rgba(250,250,247,0.15); color: var(--ink); }

        a { color: inherit; text-decoration: none; }
        a:hover { opacity: 0.7; }

        /* ── Layout ───────────────────────────────────────────── */
        .shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav {
            border-bottom: 1px solid var(--ink-08);
            padding: 20px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            color: var(--ink);
            display: block;
        }

        .brand-name {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 19px;
            letter-spacing: -0.022em;
            color: var(--ink);
        }

        .nav-meta {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            font-size: 13px;
            color: var(--ink-55);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .nav-link {
            color: var(--ink-70);
            text-decoration: none;
            border-bottom: 1px solid var(--ink-25);
            padding-bottom: 1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .nav-link:hover { color: var(--ink); border-bottom-color: var(--ink); }
        .nav-sep { color: var(--ink-25); }

        .issue-share {
            margin-top: 10px;
            background: none;
            border: 1px solid var(--ink-12);
            color: var(--ink-55);
            padding: 5px 10px;
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.15s;
        }
        .issue-share:hover { color: var(--ink); border-color: var(--ink-40); }
        .issue-share.shared { color: var(--low); border-color: var(--low); cursor: default; }
        .issue-share:disabled { opacity: 0.6; cursor: wait; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 28px 80px;
        }

        .stage {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── Hero ─────────────────────────────────────────────── */
        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--ink-55);
            margin-bottom: 28px;
        }

        h1.hero {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: clamp(48px, 8vw, 84px);
            line-height: 0.96;
            letter-spacing: -0.022em;
            margin-bottom: 28px;
        }

        h1.hero .italic { font-style: italic; }

        .lede {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: clamp(18px, 2.2vw, 22px);
            line-height: 1.5;
            color: var(--ink-85);
            max-width: 56ch;
            margin-bottom: 12px;
        }

        .sub-lede {
            font-size: 15px;
            line-height: 1.65;
            color: var(--ink-70);
            max-width: 60ch;
            margin-bottom: 56px;
        }

        /* ── Drop zone ────────────────────────────────────────── */
        .drop {
            border: 1px dashed var(--ink-25);
            padding: 64px 32px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.25s, background 0.25s;
            background: transparent;
        }

        .drop:hover, .drop.over {
            border-color: var(--ink-70);
            background: rgba(250,250,247,0.02);
        }

        .drop.has-file {
            border-color: var(--ink-70);
            background: rgba(250,250,247,0.03);
        }

        .drop-title {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 22px;
            letter-spacing: -0.015em;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .drop-sub {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            font-size: 14px;
            color: var(--ink-55);
        }

        .drop-tiny {
            margin-top: 18px;
            font-size: 11.5px;
            color: var(--ink-40);
            letter-spacing: 0.05em;
        }

        /* ── Drag overlay ─────────────────────────────────────── */
        .drag-overlay {
            position: fixed; inset: 0;
            background: rgba(10,10,10,0.94);
            display: none;
            align-items: center; justify-content: center;
            z-index: 999;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }
        .drag-overlay-text {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 36px;
            letter-spacing: -0.022em;
            color: var(--ink);
        }
        .drag-overlay-sub {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            color: var(--ink-55);
            margin-top: 8px;
        }

        /* ── Error banner ────────────────────────────────────── */
        .error-banner {
            border: 1px solid rgba(248,113,113,0.4);
            background: rgba(248,113,113,0.08);
            color: var(--ink);
            padding: 14px 18px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        /* ── Modal ────────────────────────────────────────────── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.78);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            padding: 24px;
        }
        .modal {
            background: var(--canvas);
            border: 1px solid var(--ink-12);
            max-width: 460px;
            width: 100%;
            padding: 40px 36px;
        }
        .modal-eyebrow {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--ink-55);
            margin-bottom: 18px;
        }
        .modal h2 {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 26px;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
        }
        .modal p {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            font-size: 14.5px;
            color: var(--ink-70);
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .modal label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: var(--ink-55);
            margin-bottom: 10px;
        }
        .modal input[type=email] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--ink-25);
            padding: 8px 0 10px;
            color: var(--ink);
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 17px;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal input[type=email]:focus { border-bottom-color: var(--ink); }
        .modal input[type=email]::placeholder { color: var(--ink-40); }
        .modal small {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            color: var(--ink-40);
        }
        .modal-actions {
            margin-top: 32px;
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: flex-end;
        }
        .button {
            background: var(--ink);
            color: var(--canvas);
            border: none;
            padding: 13px 26px;
            font-family: -apple-system, system-ui, sans-serif;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .button:hover { background: #EDEDE7; }
        .button:disabled { opacity: 0.45; cursor: not-allowed; }
        .button.ghost {
            background: transparent;
            color: var(--ink-70);
            padding: 13px 18px;
        }
        .button.ghost:hover { color: var(--ink); background: transparent; }

        /* ── Loading ──────────────────────────────────────────── */
        .loading {
            position: fixed; inset: 0;
            background: var(--canvas);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            gap: 32px;
            z-index: 100;
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 1px solid var(--ink-25);
            border-top-color: var(--ink);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            color: var(--ink-70);
            font-size: 18px;
            text-align: center;
        }
        .loading-sub {
            font-size: 12.5px;
            color: var(--ink-40);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* ── Results ──────────────────────────────────────────── */
        .results-wrap {
            max-width: 880px;
            margin: 0 auto;
            width: 100%;
        }
        .results-header {
            border-bottom: 1px solid var(--ink-08);
            padding-bottom: 32px;
            margin-bottom: 40px;
        }
        .results-count {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: clamp(36px, 6vw, 56px);
            letter-spacing: -0.022em;
            line-height: 1;
            margin-bottom: 18px;
        }
        .results-count .num { font-style: italic; }
        .results-summary {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 17px;
            line-height: 1.55;
            color: var(--ink-85);
            max-width: 62ch;
        }
        .severity-tally {
            display: flex;
            gap: 28px;
            margin-top: 24px;
            font-size: 13px;
            color: var(--ink-55);
        }
        .severity-tally .dot {
            display: inline-block;
            width: 7px; height: 7px;
            border-radius: 50%;
            margin-right: 7px;
            vertical-align: middle;
        }
        .severity-tally .dot.high   { background: var(--high); }
        .severity-tally .dot.medium { background: var(--medium); }
        .severity-tally .dot.low    { background: var(--low); }

        .issues {
            display: flex;
            flex-direction: column;
        }
        .issue {
            border-top: 1px solid var(--ink-08);
            padding: 28px 0;
        }
        .issue:last-child { border-bottom: 1px solid var(--ink-08); }
        .issue-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
            font-size: 11.5px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-55);
        }
        .issue-sev {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .issue-sev .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
        }
        .issue-sev.high .dot   { background: var(--high); }
        .issue-sev.medium .dot { background: var(--medium); }
        .issue-sev.low .dot    { background: var(--low); }
        .issue-sev.high   { color: var(--high); }
        .issue-sev.medium { color: var(--medium); }
        .issue-sev.low    { color: var(--low); }

        .issue-category {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            font-size: 12px;
            color: var(--ink-55);
            text-transform: none;
            letter-spacing: 0;
            padding: 2px 9px;
            border: 1px solid var(--ink-12);
            border-radius: 999px;
        }

        .issue-where {
            color: var(--ink-40);
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: var(--ink-25);
            text-underline-offset: 4px;
        }
        .issue-where:hover { color: var(--ink-70); }

        .issue-text {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 18px;
            line-height: 1.5;
            color: var(--ink);
            margin-bottom: 16px;
            letter-spacing: -0.005em;
        }
        .issue-fix {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--ink-70);
            padding-left: 18px;
            border-left: 2px solid var(--ink-12);
        }
        .issue-fix-label {
            font-family: "Instrument Serif", Georgia, serif;
            font-style: italic;
            color: var(--ink-55);
            margin-right: 6px;
        }

        .contract-section {
            margin-top: 72px;
            padding-top: 48px;
            border-top: 1px solid var(--ink-08);
        }
        .contract-eyebrow {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--ink-55);
            margin-bottom: 24px;
        }
        .paragraph {
            padding: 12px 16px;
            margin-bottom: 6px;
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--ink-70);
            transition: background 1.5s;
        }
        .paragraph .pnum {
            color: var(--ink-40);
            font-size: 11px;
            letter-spacing: 0.1em;
            margin-right: 10px;
        }
        .paragraph.flash { background: rgba(250,250,247,0.08); }

        .results-actions {
            margin-top: 56px;
            display: flex;
            gap: 24px;
            align-items: center;
        }

        /* Sigil cross-promo block on results page */
        .sigil-cta {
            margin-top: 64px;
            padding: 36px 32px;
            border: 1px solid var(--ink-12);
            background: rgba(250,250,247,0.02);
        }
        .sigil-cta-eyebrow {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--ink-55);
            margin-bottom: 14px;
        }
        .sigil-cta-headline {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 26px;
            line-height: 1.2;
            letter-spacing: -0.015em;
            margin-bottom: 12px;
            max-width: 30ch;
        }
        .sigil-cta-headline .italic { font-style: italic; }
        .sigil-cta-body {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--ink-70);
            max-width: 60ch;
            margin-bottom: 22px;
        }
        .sigil-cta-link {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: 15px;
            color: var(--ink);
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-color: var(--ink-40);
        }
        .sigil-cta-link:hover { text-decoration-color: var(--ink); opacity: 1; }

        /* Subtle fade-in on results */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .results-wrap > * { animation: fadeUp 0.5s ease-out both; }
        .results-wrap > *:nth-child(2) { animation-delay: 0.08s; }
        .results-wrap > *:nth-child(3) { animation-delay: 0.16s; }
        .results-wrap > *:nth-child(4) { animation-delay: 0.24s; }

        /* ── Footer ───────────────────────────────────────────── */
        footer {
            border-top: 1px solid var(--ink-08);
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12.5px;
            color: var(--ink-40);
        }
        footer .right { text-align: right; }
        footer a { color: var(--ink-70); }
        footer a:hover { color: var(--ink); }

        /* ── Responsive ───────────────────────────────────────── */
        @media (max-width: 640px) {
            main { padding: 36px 20px 60px; }
            .nav, footer { padding: 16px 20px; }
            .nav-meta { display: none; }
            .drop { padding: 48px 20px; }
            .modal { padding: 32px 24px; }
            .severity-tally { flex-wrap: wrap; gap: 16px; }
            .issue-meta { flex-wrap: wrap; }
            .results-actions { flex-direction: column; align-items: stretch; }
            .results-actions .button { width: 100%; }
            footer { flex-direction: column; gap: 8px; text-align: center; }
            footer .right { text-align: center; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function SigilMark() {
            return (
                <svg className="brand-mark" width="32" height="12" viewBox="0 0 36 14" fill="none" aria-hidden>
                    <path
                        d="M 2 11 C 7 1, 13 12, 18 7 C 23 2, 29 5, 34 9"
                        stroke="currentColor"
                        strokeWidth="1.4"
                        strokeLinecap="round"
                        fill="none"
                    />
                </svg>
            );
        }

        function App() {
            const [file, setFile] = React.useState(null);
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [results, setResults] = React.useState(null);
            const [dragOver, setDragOver] = React.useState(false);
            const [shared, setShared] = React.useState({}); // issueIndex -> 'sharing' | 'done'
            const [globalDrag, setGlobalDrag] = React.useState(false);
            const fileInputRef = React.useRef(null);

            // Global drag handlers
            React.useEffect(() => {
                let dc = 0;
                const dEnter = (e) => { e.preventDefault(); dc++; setGlobalDrag(true); };
                const dLeave = (e) => { e.preventDefault(); dc--; if (dc === 0) setGlobalDrag(false); };
                const dOver  = (e) => e.preventDefault();
                const dDrop  = (e) => {
                    e.preventDefault();
                    dc = 0; setGlobalDrag(false);
                    const f = e.dataTransfer.files[0];
                    if (f) handleFileSelect(f);
                };
                window.addEventListener('dragenter', dEnter);
                window.addEventListener('dragleave', dLeave);
                window.addEventListener('dragover',  dOver);
                window.addEventListener('drop',      dDrop);
                return () => {
                    window.removeEventListener('dragenter', dEnter);
                    window.removeEventListener('dragleave', dLeave);
                    window.removeEventListener('dragover',  dOver);
                    window.removeEventListener('drop',      dDrop);
                };
            }, []);

            const handleFileSelect = (f) => {
                if (!f) return;
                if (!f.name.toLowerCase().endsWith('.docx')) {
                    setError('Only .docx files. Convert your PDF first.');
                    return;
                }
                if (f.size > 10 * 1024 * 1024) {
                    setError('File too large (max 10MB).');
                    return;
                }
                setFile(f);
                setError('');
                handleSubmit(f);
            };

            const handleSubmit = async (f) => {
                const upload = f || file;
                if (!upload) return;
                setError('');
                setLoading(true);
                try {
                    const fd = new FormData();
                    fd.append('document', upload);
                    const res = await fetch('/api/check-document', { method: 'POST', body: fd });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed to analyse document');
                    setResults(data);
                } catch (err) {
                    setError(err.message || 'Something went wrong.');
                    setFile(null);
                } finally {
                    setLoading(false);
                }
            };

            const reset = () => {
                setFile(null);
                setError('');
                setResults(null);
            };

            const shareIssue = async (iss, i) => {
                if (shared[i]) return;
                setShared(s => ({ ...s, [i]: 'sharing' }));
                try {
                    const res = await fetch('/api/share-issue', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            paragraphIndex: iss.paragraphIndex ?? 0,
                            issue: iss.issue,
                            suggestion: iss.suggestion || '',
                            severity: iss.severity || 'medium',
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok || !data.shareUrl) throw new Error(data.error || 'Share failed');
                    try { await navigator.clipboard.writeText(data.shareUrl); } catch (_) {}
                    setShared(s => ({ ...s, [i]: 'done' }));
                } catch (err) {
                    setShared(s => { const n = { ...s }; delete n[i]; return n; });
                    alert('Could not share: ' + (err.message || 'unknown'));
                }
            };

            const scrollToParagraph = (idx) => {
                const el = document.getElementById(`para-${idx}`);
                if (!el) return;
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('flash');
                setTimeout(() => el.classList.remove('flash'), 1800);
            };

            // ── Loading state ──────────────────────────────────
            if (loading) {
                return (
                    <div className="loading">
                        <div className="loading-spinner"></div>
                        <div>
                            <div className="loading-text">Reading every line.</div>
                        </div>
                        <div className="loading-sub">~25 seconds</div>
                    </div>
                );
            }

            // ── Results screen ─────────────────────────────────
            if (results) {
                const issues = results.issues || [];
                const counts = { high: 0, medium: 0, low: 0 };
                issues.forEach(i => { if (counts[i.severity] !== undefined) counts[i.severity]++; });

                return (
                    <div className="shell">
                        <header className="nav">
                            <a className="brand" href="/">
                                <SigilMark />
                                <span className="brand-name">Find the Flaw · India</span>
                            </a>
                            <span className="nav-meta">
                                <a href="/gallery" className="nav-link">Hall of Shame</a>
                                <span className="nav-sep">·</span>
                                By <a href="https://sigil91.com" target="_blank" rel="noopener noreferrer">Sigil</a>
                            </span>
                        </header>

                        <main>
                            <div className="results-wrap">
                                <div className="results-header">
                                    <div className="eyebrow">Findings</div>
                                    <div className="results-count">
                                        <span className="num">{issues.length}</span>{' '}
                                        {issues.length === 1 ? 'flaw' : 'flaws'} found
                                    </div>
                                    {results.summary && (
                                        <div className="results-summary">{results.summary}</div>
                                    )}
                                    {issues.length > 0 && (
                                        <div className="severity-tally">
                                            <span><span className="dot high"></span>{counts.high} high</span>
                                            <span><span className="dot medium"></span>{counts.medium} medium</span>
                                            <span><span className="dot low"></span>{counts.low} low</span>
                                        </div>
                                    )}
                                </div>

                                {issues.length > 0 ? (
                                    <div className="issues">
                                        {issues.map((iss, i) => (
                                            <div key={i} className="issue">
                                                <div className="issue-meta">
                                                    <span className={`issue-sev ${iss.severity}`}>
                                                        <span className="dot"></span>
                                                        {iss.severity}
                                                    </span>
                                                    {iss.category && (
                                                        <span className="issue-category">
                                                            {iss.category.replace(/_/g, ' ').toLowerCase()}
                                                        </span>
                                                    )}
                                                    {typeof iss.paragraphIndex === 'number' && (
                                                        <span
                                                            className="issue-where"
                                                            onClick={() => scrollToParagraph(iss.paragraphIndex)}
                                                        >
                                                            paragraph {iss.paragraphIndex}
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="issue-text">{iss.issue}</div>
                                                {iss.suggestion && (
                                                    <div className="issue-fix">
                                                        <span className="issue-fix-label">Fix —</span>
                                                        {iss.suggestion}
                                                    </div>
                                                )}
                                                <button
                                                    className={`issue-share ${shared[i] === 'done' ? 'shared' : ''}`}
                                                    onClick={() => shareIssue(iss, i)}
                                                    disabled={shared[i] === 'sharing'}
                                                >
                                                    {shared[i] === 'done' ? '✓ link copied — added to Hall of Shame' : shared[i] === 'sharing' ? 'sharing…' : 'Send to Hall of Shame →'}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="issue-text" style={{paddingTop: 16}}>
                                        Nothing serious surfaced. Doesn't mean nothing is there — a Bar Council-enrolled advocate would still catch what the model can't.
                                    </div>
                                )}

                                {results.paragraphs && results.paragraphs.length > 0 && (
                                    <div className="contract-section">
                                        <div className="contract-eyebrow">The contract you uploaded</div>
                                        {results.paragraphs.map((p) => (
                                            <div key={p.index} id={`para-${p.index}`} className="paragraph">
                                                <span className="pnum">¶{p.index}</span>
                                                {p.text}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="sigil-cta">
                                    <div className="sigil-cta-eyebrow">If you want this signed off</div>
                                    <div className="sigil-cta-headline">
                                        An AI can spot the issues. <span className="italic">An advocate has to sign their name to it.</span>
                                    </div>
                                    <div className="sigil-cta-body">
                                        Sigil is a bench of Bar Council-enrolled advocates and AI engineers. Same analytical work, same speed — but a real advocate reads it, edits where the model got it wrong, and stamps name and enrolment number on the deliverable.
                                    </div>
                                    <a
                                        className="sigil-cta-link"
                                        href="https://sigil91.com/?utm_source=findtheflaw&utm_medium=results-cta&utm_campaign=tool-handoff"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        See how the desk works →
                                    </a>
                                </div>

                                <div className="results-actions">
                                    <button className="button" onClick={reset}>Check another contract</button>
                                </div>
                            </div>
                        </main>

                        <footer>
                            <span>© 2026 Sigil · Not legal advice.</span>
                            <span className="right">
                                <a href="https://sigil91.com/?utm_source=findtheflaw&utm_medium=footer" target="_blank" rel="noopener noreferrer">sigil91.com</a>
                            </span>
                        </footer>
                    </div>
                );
            }

            // ── Default landing ─────────────────────────────────
            return (
                <div className="shell">
                    <div className={`drag-overlay ${globalDrag ? 'active' : ''}`}>
                        <div style={{textAlign:'center'}}>
                            <div className="drag-overlay-text">Drop the contract.</div>
                            <div className="drag-overlay-sub">Release to upload</div>
                        </div>
                    </div>

                    <header className="nav">
                        <a className="brand" href="/">
                            <SigilMark />
                            <span className="brand-name">Find the Flaw · India</span>
                        </a>
                        <span className="nav-meta">
                            <a href="/gallery" className="nav-link">Hall of Shame</a>
                            <span className="nav-sep">·</span>
                            By <a href="https://sigil91.com" target="_blank" rel="noopener noreferrer">Sigil</a>
                        </span>
                    </header>

                    <main>
                        <div className="stage">
                            <div className="eyebrow">For Indian commercial contracts</div>

                            <h1 className="hero">
                                Every contract <span className="italic">hides</span> something.
                            </h1>

                            <p className="lede">
                                Drop a contract. Get the flaws — DPDPA, FEMA, GST, stamp duty, Indian Contract Act, and the usual drafting sins.
                            </p>

                            <p className="sub-lede">
                                Drop a contract, the AI reads every line, you get a report in about 25 seconds. Want a Bar Council-enrolled advocate to actually sign off on it — <a href="https://sigil91.com" target="_blank" rel="noopener noreferrer" style={{textDecoration:'underline', textUnderlineOffset:'4px', textDecorationColor:'var(--ink-40)'}}>Sigil</a> does that.
                            </p>

                            {error && <div className="error-banner">{error}</div>}

                            <div
                                className={`drop ${file ? 'has-file' : ''} ${dragOver ? 'over' : ''}`}
                                onClick={() => fileInputRef.current?.click()}
                                onDrop={(e) => { e.preventDefault(); e.stopPropagation(); setDragOver(false); setGlobalDrag(false); const f = e.dataTransfer.files[0]; if (f) handleFileSelect(f); }}
                                onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOver(true); }}
                                onDragLeave={(e) => { e.preventDefault(); e.stopPropagation(); setDragOver(false); }}
                            >
                                <div className="drop-title">
                                    {file ? file.name : 'Drop a contract'}
                                </div>
                                <div className="drop-sub">
                                    {file ? 'Click to change file' : 'or click to choose'}
                                </div>
                                <div className="drop-tiny">.DOCX · 10 MB MAX</div>
                            </div>

                            <input
                                ref={fileInputRef}
                                type="file"
                                accept=".docx"
                                onChange={(e) => handleFileSelect(e.target.files[0])}
                                style={{display: 'none'}}
                            />
                        </div>
                    </main>

                    <footer>
                        <span>© 2026 Sigil · Not legal advice.</span>
                        <span className="right">
                            <a href="https://sigil91.com" target="_blank" rel="noopener noreferrer">sigil91.com</a>
                        </span>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
