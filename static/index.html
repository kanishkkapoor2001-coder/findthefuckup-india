<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Contract Checker - Find Errors in Legal Documents</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google reCAPTCHA v3 - REPLACE WITH YOUR SITE KEY -->
    <script src="https://www.google.com/recaptcha/api.js?render=YOUR_RECAPTCHA_SITE_KEY_HERE"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', Georgia, 'Times New Roman', serif;
            background: linear-gradient(135deg, #0f1f3d 0%, #1a2f52 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 100px 20px;
            position: relative;
            color: white;
        }

        /* Global drag overlay */
        .drag-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 31, 61, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
        }

        .drag-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease-in;
        }

        .drag-overlay-content {
            text-align: center;
            color: white;
            animation: scaleIn 0.3s ease-out;
        }

        .drag-overlay-icon {
            font-size: 120px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-in-out infinite;
        }

        .drag-overlay-text {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .drag-overlay-subtext {
            font-size: 18px;
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: #1a3a5c;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .tagline {
            color: #d1d5db;
            font-size: 16px;
            font-weight: 400;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 2px dashed #4a5d7a;
            border-radius: 8px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: #93b5d8;
            background: rgba(255, 255, 255, 0.1);
        }

        .drop-zone.has-file {
            border-color: #93b5d8;
            background: rgba(255, 255, 255, 0.1);
        }

        .file-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon svg {
            width: 64px;
            height: 64px;
            opacity: 0.8;
            transition: all 0.3s;
            animation: gentleBounce 2s ease-in-out infinite;
        }

        .drop-zone:hover .file-icon svg,
        .drop-zone.has-file .file-icon svg {
            opacity: 1;
            animation: none;
        }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .drop-zone-text {
            font-size: 18px;
            color: white;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .drop-zone-subtext {
            font-size: 14px;
            color: #d1d5db;
        }

        .error-message {
            background: #dc2626;
            color: white;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease-in;
        }

        .modal {
            background: #1a3a5c;
            border-radius: 8px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.3s ease-out;
        }

        .modal-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .modal-subtitle {
            color: #d1d5db;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #4a5d7a;
            border-radius: 6px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #93b5d8;
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: #d1d5db;
            font-size: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-button {
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .modal-button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-button.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-button.primary {
            background: #93b5d8;
            color: #0f1f3d;
        }

        .modal-button.primary:hover {
            background: #a8c5e0;
        }

        .modal-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 31, 61, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.2s ease-in;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #93b5d8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            max-width: 400px;
            padding: 0 20px;
        }

        .results-container {
            animation: fadeIn 0.3s ease-in;
        }

        .results-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .results-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .results-subtitle {
            color: #d1d5db;
            font-size: 16px;
        }

        .results-content h3 {
            font-size: 22px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
            font-family: 'Playfair Display', Georgia, serif;
        }

        .issues-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .issue-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #93b5d8;
            border-radius: 6px;
            padding: 20px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .issue-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .issue-card.high {
            border-left-color: #dc2626;
        }

        .issue-card.medium {
            border-left-color: #f59e0b;
        }

        .issue-card.low {
            border-left-color: #10b981;
        }

        .issue-location {
            color: #93b5d8;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .issue-description {
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .issue-suggestion {
            color: #d1d5db;
            font-size: 14px;
            line-height: 1.5;
        }

        .share-button {
            margin-top: 12px;
            padding: 8px 16px;
            background: #1da1f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .share-button:hover {
            background: #1a8cd8;
        }

        .document-preview {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 24px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 30px;
        }

        .paragraph {
            color: #d1d5db;
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .paragraph:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .paragraph strong {
            color: #93b5d8;
            margin-right: 8px;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: #93b5d8;
            color: #0f1f3d;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button:hover {
            background: #a8c5e0;
        }

        .back-button {
            margin-top: 20px;
        }

        .powered-by-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .powered-by-footer a {
            color: #93b5d8;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .powered-by-footer a:hover {
            color: #a8c5e0;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #9ca3af;
            background: rgba(15, 31, 61, 0.95);
        }

        .footer a {
            color: #93b5d8;
            text-decoration: none;
            margin-bottom: 8px;
            display: inline-block;
        }

        .footer a:hover {
            color: #a8c5e0;
        }

        .gallery-link {
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .card {
                padding: 24px;
            }

            .logo {
                font-size: 28px;
            }

            .tagline {
                font-size: 14px;
            }

            .drop-zone {
                padding: 40px 24px;
            }

            .modal {
                padding: 24px;
            }

            .modal-title {
                font-size: 20px;
            }

            .results-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [file, setFile] = React.useState(null);
            const [email, setEmail] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [results, setResults] = React.useState(null);
            const [showModal, setShowModal] = React.useState(false);
            const [dragOver, setDragOver] = React.useState(false);
            const [globalDrag, setGlobalDrag] = React.useState(false);

            const fileInputRef = React.useRef(null);

            // Global drag and drop handlers
            React.useEffect(() => {
                let dragCounter = 0;

                const handleWindowDragEnter = (e) => {
                    e.preventDefault();
                    dragCounter++;
                    setGlobalDrag(true);
                };

                const handleWindowDragLeave = (e) => {
                    e.preventDefault();
                    dragCounter--;
                    if (dragCounter === 0) {
                        setGlobalDrag(false);
                    }
                };

                const handleWindowDragOver = (e) => {
                    e.preventDefault();
                };

                const handleWindowDrop = (e) => {
                    e.preventDefault();
                    dragCounter = 0;
                    setGlobalDrag(false);

                    const droppedFile = e.dataTransfer.files[0];
                    if (droppedFile) {
                        handleFileSelect(droppedFile);
                    }
                };

                window.addEventListener('dragenter', handleWindowDragEnter);
                window.addEventListener('dragleave', handleWindowDragLeave);
                window.addEventListener('dragover', handleWindowDragOver);
                window.addEventListener('drop', handleWindowDrop);

                return () => {
                    window.removeEventListener('dragenter', handleWindowDragEnter);
                    window.removeEventListener('dragleave', handleWindowDragLeave);
                    window.removeEventListener('dragover', handleWindowDragOver);
                    window.removeEventListener('drop', handleWindowDrop);
                };
            }, []);

            const handleFileSelect = (selectedFile) => {
                if (!selectedFile) return;

                if (!selectedFile.name.endsWith('.docx')) {
                    setError('Please upload a .docx file');
                    return;
                }

                if (selectedFile.size > 10 * 1024 * 1024) {
                    setError('File too large (max 10MB)');
                    return;
                }

                setFile(selectedFile);
                setError('');
                setShowModal(true);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOver(false);
                setGlobalDrag(false);

                const droppedFile = e.dataTransfer.files[0];
                if (droppedFile) {
                    handleFileSelect(droppedFile);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOver(false);
            };

            const handleSubmit = async () => {
                if (!email || !file) return;

                setError('');
                setShowModal(false);
                setLoading(true);

                try {
                    // Get reCAPTCHA token
                    const recaptchaToken = await window.grecaptcha.execute('YOUR_RECAPTCHA_SITE_KEY_HERE', {action: 'submit'});

                    const formData = new FormData();
                    formData.append('document', file);
                    formData.append('email', email);
                    formData.append('recaptcha_token', recaptchaToken);

                    const response = await fetch('/api/check-document', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to analyze document');
                    }

                    setResults(data);
                } catch (err) {
                    setError(err.message || 'An error occurred. Please try again.');
                    setFile(null);
                    setEmail('');
                } finally {
                    setLoading(false);
                }
            };

            const resetForm = () => {
                setFile(null);
                setEmail('');
                setError('');
                setResults(null);
            };

            const scrollToParagraph = (index) => {
                const element = document.getElementById(`para-${index}`);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    element.style.background = 'rgba(147, 181, 216, 0.2)';
                    setTimeout(() => {
                        element.style.background = '';
                    }, 2000);
                }
            };

            const shareIssueToTwitter = (issue, idx) => {
                const text = `Found a contract error! 🚨

Issue: ${issue.issue}

💡 Suggestion: ${issue.suggestion}

Check your contracts with AI Contract Checker`;

                const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank', 'width=550,height=420');
            };

            if (loading) {
                return (
                    <div className="loading-overlay">
                        <div className="loading-spinner"></div>
                        <div className="loading-text">
                            Analyzing your contract for errors...
                        </div>
                    </div>
                );
            }

            if (results) {
                return (
                    <>
                    <div className="container">
                        <div className="card">
                            <div className="results-container">
                                <div className="results-header">
                                    <div className="results-title">
                                        {results.summary}
                                    </div>
                                    <div className="results-subtitle">
                                        Found {results.issues?.length || 0} potential issues in your contract
                                    </div>
                                </div>

                                {results.issues && results.issues.length > 0 && (
                                    <div className="results-content">
                                        <h3>Issues Found</h3>
                                        <div className="issues-list">
                                            {results.issues.map((issue, idx) => (
                                                <div
                                                    key={idx}
                                                    className={`issue-card ${issue.severity}`}
                                                >
                                                    <div onClick={() => scrollToParagraph(issue.paragraphIndex)} style={{cursor: 'pointer'}}>
                                                        <div className="issue-location">
                                                            📍 Paragraph {issue.paragraphIndex}
                                                        </div>
                                                        <div className="issue-description">
                                                            <strong>Issue:</strong> {issue.issue}
                                                        </div>
                                                        <div className="issue-suggestion">
                                                            💡 Suggestion: {issue.suggestion}
                                                        </div>
                                                    </div>
                                                    <button
                                                        className="share-button"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            shareIssueToTwitter(issue, idx);
                                                        }}
                                                    >
                                                        🐦 Share to Twitter
                                                    </button>
                                                </div>
                                            ))}
                                        </div>

                                        <h3>Document Preview</h3>
                                        <div className="document-preview">
                                            {results.paragraphs?.map((para) => (
                                                <div
                                                    key={para.index}
                                                    id={`para-${para.index}`}
                                                    className="paragraph"
                                                >
                                                    <strong>[Para {para.index}]:</strong> {para.text}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <button onClick={resetForm} className="button back-button">
                                    Check Another Contract
                                </button>
                            </div>
                        </div>

                        <div className="footer">
                            © 2026 - All Rights Reserved | This tool is not legal advice and does not create an attorney-client relationship. We don't save your contract.
                        </div>
                    </div>
                    </>
                );
            }

            return (
                <>
                    {/* Global drag overlay */}
                    <div className={`drag-overlay ${globalDrag ? 'active' : ''}`}>
                        <div className="drag-overlay-content">
                            <div className="drag-overlay-icon">📄</div>
                            <div className="drag-overlay-text">Drop your contract</div>
                            <div className="drag-overlay-subtext">Release to upload</div>
                        </div>
                    </div>

                    <div className="container">
                        <div className="card">
                            <div className="header">
                                <div className="logo">AI Contract Checker</div>
                                <div className="tagline">
                                    AI-powered contract analysis to find errors and inconsistencies
                                </div>
                            </div>

                            {error && (
                                <div className="error-message">
                                    ⚠️ {error}
                                </div>
                            )}

                            <div className="upload-section">
                                <div
                                    className={`drop-zone ${file ? 'has-file' : ''} ${dragOver ? 'drag-over' : ''}`}
                                    onClick={() => fileInputRef.current?.click()}
                                    onDrop={handleDrop}
                                    onDragOver={handleDragOver}
                                    onDragLeave={handleDragLeave}
                                >
                                    <div className="file-icon">
                                        {file ? (
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                                <polyline points="14 2 14 8 20 8"></polyline>
                                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                                <polyline points="10 9 9 9 8 9"></polyline>
                                            </svg>
                                        ) : (
                                            <div style={{fontSize: '64px', animation: 'gentleBounce 2s ease-in-out infinite'}}>📄</div>
                                        )}
                                    </div>
                                    <div className="drop-zone-text">
                                        {file ? file.name : 'Drop your contract anywhere'}
                                    </div>
                                    <div className="drop-zone-subtext">
                                        {file ? 'Click to change file' : 'or click to browse (.docx files only)'}
                                    </div>
                                </div>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    accept=".docx"
                                    onChange={(e) => handleFileSelect(e.target.files[0])}
                                    style={{display: 'none'}}
                                />
                            </div>

                            <div className="powered-by-footer">
                                <a href="https://github.com/yourusername/contract-checker" target="_blank" rel="noopener noreferrer">
                                    Open Source Project
                                </a>
                            </div>
                        </div>
                    </div>

                    {showModal && (
                        <div className="modal-overlay" onClick={() => setShowModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <div className="modal-title">Enter Your Company Email</div>
                                    <div className="modal-subtitle">
                                        We'll analyze your contract for errors and inconsistencies
                                    </div>
                                </div>

                                <div className="form-group">
                                    <label htmlFor="email">Company Email Address</label>
                                    <input
                                        type="email"
                                        id="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="you@company.com"
                                        autoFocus
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter' && email) {
                                                handleSubmit();
                                            }
                                        }}
                                    />
                                    <small>
                                        No Gmail or other personal email addresses
                                    </small>
                                </div>

                                <div className="modal-actions">
                                    <button
                                        className="modal-button secondary"
                                        onClick={() => {
                                            setShowModal(false);
                                            setFile(null);
                                        }}
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        className="modal-button primary"
                                        onClick={handleSubmit}
                                        disabled={!email}
                                    >
                                        Analyze Contract
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="footer">
                        <a href="/gallery" className="gallery-link">📸 View Gallery</a>
                        <br />
                        © 2026 - All Rights Reserved | This tool is not legal advice and does not create an attorney-client relationship. We don't save your contract.
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
